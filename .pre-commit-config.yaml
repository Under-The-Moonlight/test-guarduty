repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        exclude: ^modules/guardduty-organization/ # needs an aliased provider, validated through examples/organization
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--framework terraform

  - repo: local
    hooks:
      - id: terraform-docs
        name: terraform-docs
        language: system
        entry: bash -c 'terraform-docs modules/guardduty && terraform-docs modules/guardduty-organization'
        pass_filenames: false
        files: \.tf$
